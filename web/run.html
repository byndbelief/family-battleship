<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="r4box">
  <title>Chaos Run · r4box</title>
  <meta name="theme-color" content="#0E0A1E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Sora:wght@400;600;800&display=swap">
  <style>
  /* The run wears whichever organ is live: the stage's --bg and --gold follow it (shell.js applyTheme). */
  :root{color-scheme:dark;--bg:#0E0A1E;--panel:#1A1433;--line:#3E3480;--ink:#F3F1FF;--muted:#BDB6E6;--gold:#F5C542;--bannerc:#FFE08A;
    --display:"Bungee","Arial Black",Impact,sans-serif;--body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  html,body{background:var(--bg);margin:0;height:100%}
  body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;overscroll-behavior:none}
  [hidden]{display:none!important}
  .wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .topnav{display:flex;align-items:center;gap:10px;min-height:40px}
  .topnav a{color:var(--gold);font-weight:800;text-decoration:none}
  h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.05}
  h1{font-size:clamp(20px,5.5vw,30px)}
  button{font:inherit;font-weight:800;cursor:pointer;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 16px}
  button.go{background:var(--gold);border-color:var(--gold);color:#2A2100;font-size:18px;padding:12px 22px}
  #play{position:relative}
  .stage{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 14px 34px #0009;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--bg)}
  #cv{display:block;width:100%;cursor:pointer}
  #play.fs-on{position:fixed;inset:0;z-index:60;background:var(--bg);padding:0}
  #play.fs-on .stage{border-radius:0;height:100%}
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap">
  <nav class="topnav gtop"><a href="./">← r4box</a><h1 class="intop">🧬 Chaos Run</h1></nav>
  <section id="play"><div class="stage" id="stage"><canvas id="cv" aria-label="The run: worlds that morph into each other as the chaos curve says"></canvas></div></section>
</div>
<script type="module">
  import { runShell } from './shell.js';
  import squirrel from './organs/squirrel.js';
  import fractal from './organs/fractal.js';
  import salvo from './organs/salvo.js';
  import putt from './organs/putt.js';
  import hilltop from './organs/hilltop.js';
  import rally from './organs/rally.js';
  runShell({
    organs: [squirrel, putt, fractal, hilltop, salvo, rally], key: 'run', title: 'Chaos Run', icon: '🧬', again: 'Run again',
    intro: `<p>One run, many worlds. <b>The chaos curve morphs one game into the next</b>: a peak twists the world, the mirror brings back the one before, the golden cut dives you into the one you've been away from longest.</p>
      <p class="muted small">Every world has three lives of its own and starts over easy when they're gone, for one of the run's hearts. Fig in the corner is you.</p>
      <p class="muted small">🐿️ tap to staple · 🔺 tap to jump, hold to dash · ⚓ tap the sea · ⛳ drag back and let go · 💥 drag to aim · 🏎️ hold a side to steer</p>`,
  });
</script>
</body>
</html>
