<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Game Room">
  <title>Hilltop Duel</title>
  <meta name="theme-color" content="#15122E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@400;600;700&display=swap">
  <style>
  /* One deliberate look: a night-sky arcade. Single theme by choice. */
  :root{
    color-scheme:dark;
    --bg:#15122E; --bg-2:#1E1A40; --panel:#231F4A; --line:#3A3470; --ink:#F3EEFF; --muted:#A9A0D6;
    --coral:#FF6B5A; --gold:#FFC857; --teal:#3DD6C6; --lilac:#B79CFF;
    --display:"Rubik Mono One","Arial Black",Impact,sans-serif;
    --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg);margin:0}
  body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:0 16px;
    padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));
    background:radial-gradient(1200px 500px at 70% -10%,#2B2466 0%,transparent 60%),var(--bg)}
  [hidden]{display:none!important}
  .wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
  h1{font-size:clamp(24px,6vw,40px)} h2{font-size:18px}
  p{margin:0} a{color:var(--gold);font-weight:700}
  .muted{color:var(--muted)} .small{font-size:13px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .between{justify-content:space-between}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
  button{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;border:1.5px solid var(--line);background:var(--bg-2);color:var(--ink);padding:10px 16px}
  button.go{background:var(--coral);border-color:var(--coral);color:#1a0f0d;font-family:var(--display);font-weight:400;letter-spacing:.03em}
  button.link{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0E0C22}
  .stage canvas{display:block;width:100%;height:auto;touch-action:manipulation}
  /* 🔥 Fire where you let go: a see-through Fire under your finger after an aiming pull, with the
     fine-tune buttons round it (⤴⤵ angle on the left, −+ power on the right) and the aim under it */
  .firehere{position:absolute;z-index:8;width:156px;height:132px;transform:translate(-50%,-50%);pointer-events:none}
  .firehere[hidden]{display:none}
  .firehere > *{pointer-events:auto;touch-action:none!important}   /* a pull may start on it (duel.js): no scrolling away with it */
  .fhfire{position:absolute;left:40px;top:22px;width:76px;height:76px;padding:0;border-radius:50%;border:2.5px solid #FFF4D6cc;background:radial-gradient(circle at 50% 38%,#FF8A6Aa6,#E4572E99 60%,#B83A1C99);color:#fff;font:900 24px/1 system-ui,sans-serif;display:grid;place-items:center;align-content:center;gap:2px;box-shadow:0 6px 18px #0006;text-shadow:0 1px 3px #0009;touch-action:manipulation;cursor:pointer;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .fhfire b{font-size:12px;letter-spacing:.06em}
  .fhfire:active{transform:scale(.92)}
  .fhn{position:absolute;width:36px;height:36px;min-height:0;padding:0;border-radius:50%;border:1.5px solid #ffffff55;background:#0E0C2266;color:#fff;font:800 19px/1 system-ui,sans-serif;display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .fhn:active{background:#FFC85766}
  .fh-au{left:0;top:10px}.fh-ad{left:0;top:74px}.fh-pu{right:0;top:10px}.fh-pd{right:0;top:74px}
  .fhread{position:absolute;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap;padding:2px 8px;border-radius:99px;background:#0E0C2288;color:#FFE08A;font:800 12px/1.3 system-ui,sans-serif;font-variant-numeric:tabular-nums;pointer-events:none}
  .firehere.pop .fhfire{animation:fhpop .28s cubic-bezier(.2,1.6,.4,1)}
  @keyframes fhpop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.firehere.pop .fhfire{animation:none}}
  /* 🎥 the tank cam: your tank, when zooming in has left it off screen */
  .tankcam{position:absolute;left:8px;bottom:8px;z-index:3;width:min(36%,230px);padding:0;border:2px solid var(--c,#FFC857);border-radius:10px;overflow:hidden;background:#0E0C22;box-shadow:0 4px 14px #0009;cursor:pointer}
  .tankcam[hidden]{display:none}
  .tankcam canvas{display:block;width:100%;height:auto;touch-action:manipulation}
  .tankcam .tchp{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:2px 6px;font:700 11px/1.3 system-ui,sans-serif;color:#fff;background:#0009;overflow:hidden}
  .tankcam .tchp i{position:absolute;left:0;bottom:0;height:3px;width:var(--hp,100%);background:var(--c,#FFC857);transition:width .4s}
  .tankcam .tchp b{margin-left:auto}
  .tankcam.hit{animation:tchit .7s ease-out}
  @keyframes tchit{0%{box-shadow:0 0 0 4px #FF4D4D,0 0 24px #FF4D4D}100%{box-shadow:0 4px 14px #0009}}
  .tankcam .tcdmg{position:absolute;left:78%;top:32%;transform:translateX(-50%);font:900 22px/1 system-ui,sans-serif;color:#FF5A5A;text-shadow:0 2px 4px #000;pointer-events:none;animation:tcdmg 1.4s ease-out forwards}
  @keyframes tcdmg{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-26px)}}
  @media (prefers-reduced-motion: reduce){.tankcam.hit,.tankcam .tcdmg{animation:none}}
  .hud{position:absolute;inset:10px 12px auto 12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;font-weight:700;font-size:13px}
  .hp{display:flex;flex-direction:column;gap:4px;flex:0 1 150px;min-width:0;white-space:nowrap;overflow:hidden}
  .hp .bar{height:8px;border-radius:99px;background:#ffffff22;overflow:hidden}
  .hp .bar i{display:block;height:100%;border-radius:99px;transition:width .6s}
  .hp.right{text-align:right;align-items:flex-end}
  .hp>span:first-child{display:flex;align-items:center;max-width:100%;min-width:0}
  .hp .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .hp .face{flex:none}
  /* Off your shot the controls stay up: Fire! waits, driving is locked, aiming can be lined up */
  #controls.waiting .moverow{opacity:.4}
  #controls.waiting #fire{opacity:.55;font-size:.8em}
  /* 3-4 players: a chip per tank across the top, the wind on its own line below */
  /* Health (047): one slim strip of pills for any number of tanks, the wind on the same line */
  .hud.multi{flex-wrap:nowrap;align-items:center;gap:6px}
  .hud.multi .hp{display:none}
  .hud.multi .wind{order:2;flex:none;align-self:center;margin:0}
  .hprow{display:flex;gap:4px;flex:1;min-width:0}
  .hprow[hidden]{display:none}
  .hpc{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:3px;height:22px;padding:0 7px;border-radius:99px;font-size:12px;white-space:nowrap;overflow:hidden;
    background:linear-gradient(90deg,color-mix(in srgb,var(--c) 42%,#0000) var(--hp),#0008 var(--hp));transition:background .6s}
  .hpc.turn{box-shadow:inset 0 0 0 2px var(--c)}
  .hpc.out{opacity:.45}
  .hpc .nm{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;display:none}
  .hpc b{flex:none;margin-left:auto}
  .hpc .tg{flex:0 1 auto;min-width:0;overflow:hidden;font-size:10px}
  .hpc .face{flex:none}
  .hpc i.dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
  .hprow.tight .face{display:none}
  .hprow.tight .hpc{padding:0 5px}
  @media (min-width:700px){.hpc .nm{display:block}}
  .wind{align-self:flex-start;background:#0008;border-radius:999px;padding:3px 10px;white-space:nowrap}
  @media (max-width:520px){.hud{font-size:11px;inset:8px 8px auto 8px}}
  #play:not(.fs-on) .stage.bighud{display:flex;flex-direction:column}
  #play:not(.fs-on) .stage.bighud .hud{position:static;order:-1;padding:8px 8px 6px;background:#0E0C22}
  .stage .hud .cambar{position:static;order:3;pointer-events:auto;opacity:1;margin-top:4px;gap:4px}
  .stage .hud .cambar button{width:34px;height:30px;font-size:15px;border-radius:8px}
  #play:not(.fs-on) .stage.bighud .hud{flex-wrap:wrap}
  #play:not(.fs-on) .stage.bighud .hprow{flex:1 1 100%}
  #play:not(.fs-on) .stage.bighud .hud .wind{flex:1;align-self:center;text-align:center}
  .sliders{display:flex;flex-direction:column;gap:10px}
  .slider{display:grid;grid-template-columns:52px 44px minmax(0,1fr) 44px 44px;align-items:center;gap:8px;font-weight:700;font-size:14px;width:100%}
  .slider output{font-variant-numeric:tabular-nums;text-align:right;color:var(--gold);font-size:17px}
  .step{width:44px;height:44px;padding:0;font-size:24px;line-height:1;border-radius:12px;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .step:active{background:var(--line)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;touch-action:pan-y}
  input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--gold) var(--fill,50%),#ffffff22 var(--fill,50%))}
  input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:#ffffff22}
  input[type=range]::-moz-range-progress{height:10px;border-radius:99px;background:var(--gold)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-10px;border-radius:50%;background:#FFF4D6;border:3px solid var(--gold);box-shadow:0 2px 8px #0008}
  input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#FFF4D6;border:3px solid var(--gold)}
  input[type=range]:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
  button.go#fire{min-height:64px;min-width:120px;font-size:20px}
  .aimtip{margin:0}
  .aimbar{display:grid;grid-template-columns:44px 44px minmax(0,1fr) 44px 44px;gap:8px;align-items:center}
  .aimread{display:flex;justify-content:center;gap:14px;font-weight:800;white-space:nowrap}
  .aimread output{color:var(--gold);font-size:18px;font-variant-numeric:tabular-nums}
  @media (max-width:520px){.aimbar{grid-template-columns:40px 40px minmax(0,1fr) 40px 40px;gap:6px}.aimread{gap:8px}.aimread output{font-size:16px}}
  #dodge{padding:10px 12px;gap:6px;border-color:#3DD6C666}
  .dodgetip{margin:0}
  #play.fs-on .dodgetip{display:none}
  .fuel{display:block;height:12px;border-radius:99px;background:#ffffff1f;overflow:hidden;align-self:center}
  .fuel i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#FF6B5A,#FFC857);transition:width .1s}
  .moverow output::before{content:'⛽ ';font-size:12px}
  /* Move / ⛏️ Dig: tap the label to switch how the Move bar gets you there */
  .modebtn{display:grid;place-items:center;align-content:center;gap:1px;width:100%;height:44px;min-height:0;padding:0;border-radius:12px;font-size:11.5px;font-weight:800;line-height:1;touch-action:manipulation}
  .modebtn .mi{font-size:18px}
  .modebtn[aria-pressed="true"]{border-color:var(--gold);background:#FFC85726;color:var(--gold);box-shadow:0 0 10px #FFC85744}
  /* Move / Dodge: the handle is your tank's spot; the track spans as far as your fuel reaches */
  input.mover::-webkit-slider-runnable-track{background:linear-gradient(90deg,#FF6B5A55,#FFC85755)}
  input.mover::-moz-range-track{background:linear-gradient(90deg,#FF6B5A55,#FFC85755)}
  input.mover::-moz-range-progress{background:transparent}
  input.mover::-webkit-slider-thumb{background:#FFC857;border-color:#FF6B5A}
  input.mover::-moz-range-thumb{background:#FFC857;border-color:#FF6B5A}
  input.mover:disabled{opacity:.45}
  #play.fs-on .aimtip{display:none}
  @media (max-width:640px){h1{font-size:22px} .wrap{gap:12px} #play{gap:10px} #controls{padding:12px}}
  .controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
  .controls > *{min-width:0}
  @media (max-width:520px){.controls{grid-template-columns:minmax(0,1fr)} button.go#fire{width:100%}}
  .status{font-weight:700}
  .botlive{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .botlive button{border-radius:99px;padding:8px 14px}
  .botlive button[aria-pressed=true]{background:var(--coral);border-color:var(--coral);color:#1a0f0d}
  .stamp{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:16px;text-align:center}
  .stamp span{font-family:var(--display);font-size:clamp(34px,10vw,76px);line-height:.95;color:#FFE08A;-webkit-text-stroke:3px #3A1D00;paint-order:stroke fill;text-shadow:0 6px 0 #3A1D00,0 0 40px #F2C230;animation:stampin 2.4s cubic-bezier(.2,1.6,.4,1) both}
  .stamp.red span{color:#FF6B5E;-webkit-text-stroke-color:#2A0000;text-shadow:0 6px 0 #2A0000,0 0 40px #FF5A4E}
  @keyframes stampin{0%{transform:scale(2.4) rotate(-8deg);opacity:0}14%{transform:scale(.92) rotate(2deg);opacity:1}34%,78%{transform:scale(1);opacity:1}100%{transform:scale(1.3);opacity:0}}
  .feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
  .feed li{border-left:3px solid var(--line);padding-left:10px}
  @media (prefers-reduced-motion:reduce){.stamp span{animation:none}}
  #play{display:flex;flex-direction:column;gap:16px}
  .stage .fsslot{position:absolute;right:8px;bottom:8px;opacity:.55;transition:opacity .2s}
  .stage .fsslot:hover,.stage .fsslot:focus-within,.stage .fsslot:active{opacity:1}
  /* Zoom (4+ tanks): see-through buttons in the bottom-left corner of the battlefield */
  .stage .cambar{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;opacity:.6;transition:opacity .2s;z-index:3}
  .stage .cambar:hover,.stage .cambar:focus-within,.stage .cambar:active{opacity:1}
  .stage .cambar button{width:38px;height:38px;min-height:0;padding:0;border-radius:10px;font-size:18px;line-height:1;background:#0E0C22cc;border:1px solid #ffffff33;color:#fff;touch-action:manipulation}
  .stage .cambar button[disabled]{opacity:.35}
  .stage .cambar[hidden]{display:none}   /* see-through, so a tank at the far right still shows */
  /* Full screen: the battlefield takes all the room the controls leave. */
  #play.fs-on{gap:8px}
  #play.fs-on .stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;border:0;background:#0E0C22}
  #play.fs-on .stage canvas{width:auto;height:auto;max-width:100%;max-height:100%}
  #play.fs-on #controls{padding:10px 12px;gap:6px}
  #play.fs-on #shotsFold{display:none}

  /* Desktop: the battlefield as big as the window allows, the controls in a column beside it,
     everything on one screen. The rows are content-sized; the last one takes up the slack so the
     battlefield spanning them all doesn't spread the side column apart. */
  @media (min-width:1000px) and (min-height:560px){
    body{padding-inline:24px;padding-block:14px 24px}
    .wrap{max-width:1560px;gap:12px}
    h1{font-size:30px}
    #play:not(.fs-on){display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:repeat(8,auto) 1fr;column-gap:20px;row-gap:14px;align-items:start}
    #play:not(.fs-on) .stage{grid-column:1;grid-row:1 / -1;width:100%;max-width:calc((100dvh - 170px) * 1.818);justify-self:center}
    #play:not(.fs-on) > :not(.stage){grid-column:2}
    #play .controls{grid-template-columns:1fr}
    #play .controls > .row{flex-wrap:nowrap}
    button.go#fire{flex:1;min-height:60px}
    .slider{grid-template-columns:48px 40px minmax(0,1fr) 40px 50px;gap:6px}
    .step{width:40px;height:40px;font-size:22px}
    #shotsFold .feed{max-height:34vh;overflow:auto}
    #play:not(.fs-on) #pack .backpack{gap:6px!important;padding:10px!important}
    #play:not(.fs-on) #pack .backpack>span:first-child{width:100%}
    #play:not(.fs-on) #pack .backpack button{font-size:14px;padding:6px 10px;border-radius:10px}
    #play:not(.fs-on) .aimtip{font-size:12px}
    #play.fs-on{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:repeat(3,auto) 1fr;column-gap:16px;align-items:start}
    #play.fs-on .stage{grid-row:1 / -1;height:100%}
    #play.fs-on > :not(.stage){grid-column:2}
  }
  /* Full screen on a landscape phone (047): the battlefield the full height on the left (no gap
     above it for the toolbar), the controls in a 212px column whose top the toolbar sits over. */
  /* Phone on its side, full screen: the battlefield covers the whole screen (the canvas takes the
     screen's shape and the camera trims the top of the sky: fitCanvas in duel.js) and the controls
     float over it in the corners, see-through: aim and power by the slingshot gesture anywhere,
     fine-tune ⤴⤵ −+ and FIRE bottom right, the backpack up the right edge, driving bottom left. */
  @media (orientation:landscape) and (max-height:520px){
    body.fs-lock #play.fs-on{padding:0!important;display:block;overflow:hidden}
    #play.fs-on .stage{position:absolute;inset:0;height:auto;border-radius:0;display:block}
    #play.fs-on .stage canvas#cv{width:100%;height:100%;max-width:none;max-height:none}
    #play.fs-on .hud{inset:calc(8px + env(safe-area-inset-top,0px)) calc(250px + env(safe-area-inset-right,0px)) auto calc(8px + env(safe-area-inset-left,0px))}
    #play.fs-on .stage .cambar{left:calc(8px + env(safe-area-inset-left,0px));top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column}
    #play.fs-on .tankcam{left:calc(8px + env(safe-area-inset-left,0px));top:44px;bottom:auto;width:min(26%,190px)}
    #play.fs-on .stage .fsslot{display:none}
    #play.fs-on #controls,#play.fs-on #controls .controls,#play.fs-on #controls .sliders{position:static;display:contents}
    #play.fs-on #controls[hidden]{display:none}
    #play.fs-on #controls > .aimtip,#play.fs-on #shotsFold{display:none}
    /* each group floats on its own, dark glass so the hills show through */
    #play.fs-on .aimbar,#play.fs-on .moverow,#play.fs-on #dropRow,#play.fs-on #packMini,#play.fs-on #dodge{position:absolute;z-index:6;background:#0E0C2277;border:1px solid #ffffff26;border-radius:14px;padding:5px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
    #play.fs-on .aimbar{right:calc(96px + env(safe-area-inset-right,0px));bottom:8px;display:grid;grid-template-columns:38px 38px;grid-template-areas:"r r" "a b" "c d";gap:4px}
    #play.fs-on .aimbar .aimread{grid-area:r;flex-direction:row;gap:8px;font-size:12px;line-height:1.2;justify-content:center}
    #play.fs-on .aimbar .aimread output{font-size:14px}
    #play.fs-on .aimbar [data-step=angle][data-d="1"]{grid-area:a}
    #play.fs-on .aimbar [data-step=angle][data-d="-1"]{grid-area:c}
    #play.fs-on .aimbar [data-step=power][data-d="1"]{grid-area:b}
    #play.fs-on .aimbar [data-step=power][data-d="-1"]{grid-area:d}
    #play.fs-on .aimbar .step{width:38px;height:38px;font-size:20px}
    #play.fs-on #controls .row:has(#fire){position:absolute;z-index:6;right:calc(8px + env(safe-area-inset-right,0px));bottom:8px;display:flex;flex-direction:column;gap:4px;align-items:center}
    #play.fs-on button.go#fire{width:80px;height:80px;min-width:0;min-height:0;padding:0;border-radius:50%;font-size:17px;box-shadow:0 4px 16px #0009,0 0 0 3px #ffffff33}
    #play.fs-on .moverow{left:calc(8px + env(safe-area-inset-left,0px));right:auto;width:auto;bottom:8px;display:grid;grid-template-columns:40px 40px 40px auto;gap:4px;align-items:center}
    #play.fs-on .moverow input.mover{display:none}
    #play.fs-on .moverow .modebtn,#play.fs-on .moverow .step{width:40px;height:40px}
    #play.fs-on .modebtn .ml{display:none}
    #play.fs-on .moverow output{font-size:13px;padding-right:4px}
    #play.fs-on #dropRow{left:50%;transform:translateX(-50%);bottom:8px;width:min(40%,300px);display:grid;grid-template-columns:36px minmax(0,1fr) 36px 30px;gap:4px;align-items:center}
    #play.fs-on #dropRow label{display:none}
    #play.fs-on #dropRow .step{width:36px;height:36px}
    #play.fs-on #dropRow[hidden]{display:none}
    #play.fs-on .aimbar,#play.fs-on #fire{display:none}   /* the Fire under your finger has them (052) */
    #play.fs-on #packMini{right:calc(8px + env(safe-area-inset-right,0px));bottom:52px;max-height:calc(100dvh - 112px);overflow-y:auto;padding:8px 10px 4px 5px}
    #play.fs-on #packMini:empty{display:none}
    #play.fs-on #packMini .packmini,#play.fs-on #packMini > *{flex-direction:column!important;flex-wrap:nowrap!important}
    #play.fs-on #dodge{left:calc(8px + env(safe-area-inset-left,0px));bottom:8px;width:min(46%,330px)}
    #play.fs-on #dodge[hidden]{display:none}
    #play.fs-on #err{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:56px;margin:0;padding:2px 8px;border-radius:8px;background:#0E0C22cc}
    #play.fs-on #err:empty{display:none}
    #play.fs-on #endPanel,#play.fs-on #nextSlot:not(:empty),#play.fs-on #pack:not(:empty){position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);width:min(70vw,520px);max-height:84dvh;overflow:auto}
    #play.fs-on #endPanel[hidden]{display:none}
    #play.fs-on #pack{display:none}
    #play.fs-on #packMini .packmini{padding:0;gap:6px}
    #play.fs-on #packMini .pmlabel{display:none}
  }
  /* Full screen, upright: the HP strip and wind sit up top beside the toolbar */
  @media (orientation:portrait){ body.fs-lock #play.fs-on .hud{right:var(--gtw,56px)} }
  </style>
</head>
<body>
<div class="wrap">
  <nav class="row between gtop"><a href="./">← All games</a><span class="small muted" id="live"></span></nav>
  <div id="gtbar"></div>
  <header class="row between" style="align-items:flex-end">
    <div><span class="small muted" style="letter-spacing:.14em;text-transform:uppercase;font-weight:700">Hilltop Duel</span><h1 id="title">Loading…</h1></div>
    <span class="status" id="status"></span>
  </header>
  <div id="play">
  <div class="stage">
    <canvas id="cv" width="1600" height="880" aria-label="Artillery battlefield"></canvas>
    <div class="firehere" id="fireHere" hidden role="group" aria-label="Fire and fine-tune">
      <button type="button" class="fhfire" id="fireHereBtn" aria-label="Fire">🔥<b>FIRE</b></button>
      <button type="button" class="fhn fh-au" data-step="angle" data-d="1" aria-label="Aim higher">⤴</button>
      <button type="button" class="fhn fh-ad" data-step="angle" data-d="-1" aria-label="Aim lower">⤵</button>
      <button type="button" class="fhn fh-pu" data-step="power" data-d="1" aria-label="More power">+</button>
      <button type="button" class="fhn fh-pd" data-step="power" data-d="-1" aria-label="Less power">−</button>
      <span class="fhread" id="fhRead" aria-live="off"></span>
    </div>
    <button type="button" class="tankcam" id="tankCam" hidden aria-label="Your tank is off screen: tap to look at it"><canvas id="tankCamCv" width="460" height="253"></canvas><span class="tchp" id="tankCamHp"><i></i><span>🎥 You</span><b></b></span></button>
    <div class="cambar" id="camBar" hidden role="group" aria-label="Zoom">
      <button type="button" data-cam="in" aria-label="Zoom in">＋</button><button type="button" data-cam="out" aria-label="Zoom out">－</button><button type="button" data-cam="me" aria-label="Look at your tank">🎯</button><button type="button" data-cam="fit" aria-label="Show the whole battlefield">⤢</button>
    </div>
    <div class="hud">
      <div class="hprow" id="hpRow" hidden></div>
      <div class="hp"><span id="n0"></span><div class="bar"><i id="hp0" style="background:var(--coral);width:100%"></i></div></div>
      <span class="wind" id="wind"></span>
      <div class="hp right"><span id="n1"></span><div class="bar"><i id="hp1" style="background:var(--teal);width:100%"></i></div></div>
    </div>
  </div>
  <section class="panel" id="controls" hidden>
    <p class="small muted aimtip noteline">Drag back from anywhere, like a slingshot: the shell flies the other way, and a longer pull is more power. Fine-tune below.</p>
    <div class="controls">
      <div class="sliders">
        <!-- Aim like Putt Post (046): a slingshot gesture anywhere, fine-tuned here. The hidden ranges hold the aim. -->
        <div class="aimbar" id="aimbar">
          <input type="range" id="angle" min="5" max="85" value="45" hidden><input type="range" id="power" min="20" max="100" value="62" hidden>
          <button type="button" class="step" data-step="angle" data-d="1" aria-label="Aim higher">⤴</button>
          <button type="button" class="step" data-step="angle" data-d="-1" aria-label="Aim lower">⤵</button>
          <span class="aimread"><span title="Angle">🎯 <output id="angleOut">45°</output></span><span title="Power">⚡ <output id="powerOut">62</output></span></span>
          <button type="button" class="step" data-step="power" data-d="-1" aria-label="Less power">−</button>
          <button type="button" class="step" data-step="power" data-d="1" aria-label="More power">+</button>
        </div>
        <div class="slider" id="dropRow" hidden><label for="drop">Drop</label><button type="button" class="step" data-step="drop" data-d="-1" aria-label="Drop further left">−</button><input type="range" id="drop" min="0" max="799" value="400"><button type="button" class="step" data-step="drop" data-d="1" aria-label="Drop further right">+</button><output id="dropOut">🚁</output></div>
        <div class="slider moverow"><button type="button" id="digBtn" class="modebtn" aria-pressed="false" title="Drive over the hills, or dig straight through them"><span class="mi" aria-hidden="true">🚜</span><span class="ml">Move</span></button><button type="button" class="step" data-mv="-1" aria-label="Drive left">◀</button><input type="range" id="moveRange" class="mover" min="0" max="800" step="1" value="90" aria-label="Where your tank is: drag to drive"><button type="button" class="step" data-mv="1" aria-label="Drive right">▶</button><output id="fuelOut" aria-label="Fuel left">40</output></div>
      </div>
      <div id="packMini"></div>
      <div class="row" style="gap:10px;justify-content:center"><span data-clockslot></span><button class="go" id="fire">Fire!</button></div>
    </div>
    <p class="small muted" id="err"></p>
  </section>
  <section class="panel" id="dodge" hidden>
    <div class="slider moverow"><label>Dodge</label><button type="button" class="step" data-dv="-1" aria-label="Dodge left">◀</button><input type="range" id="dodgeRange" class="mover" min="0" max="800" step="1" value="90" aria-label="Where your tank is: drag to dodge"><button type="button" class="step" data-dv="1" aria-label="Dodge right">▶</button><output id="dodgeOut" aria-label="Dodge fuel left">20</output></div>
    <p class="small muted dodgetip">They're lining up a shot at you. Shift your tank before they fire.</p>
  </section>
  <div id="pack"></div>
  <section class="panel" id="endPanel" hidden></section>
  <div id="nextSlot"></div>
  <details class="panel mfold" id="shotsFold"><summary><h2>Shots</h2></summary><ul class="feed" id="feed"></ul>
    </details>
  </div>
</div>
<script type="module" src="duel.js"></script>
</body>
</html>
