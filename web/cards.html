<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Game Room">
  <title>Chaos Cards</title>
  <meta name="theme-color" content="#0E3B2E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap">
  <style>
  /* One deliberate look: a card table under a lamp. Single theme by choice. */
  :root{
    color-scheme:dark;
    --bg:#0B2A22; --felt:#12573F; --felt-2:#0E4634; --panel:#0F3A2D; --line:#23705A; --ink:#F4F7EF; --muted:#A9CDBE;
    --gold:#F5C542; --R:#E5484D; --G:#2FB36C; --B:#3B82F6; --Y:#F5B81F;
    --display:"Bungee","Arial Black",Impact,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg);margin:0}
  body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding:0 16px;
    padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));
    background:radial-gradient(900px 520px at 50% 18%,#1C7355 0%,transparent 70%),var(--bg)}
  [hidden]{display:none!important}
  .wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.05;letter-spacing:.01em}
  h1{font-size:clamp(22px,5.5vw,34px)} h2{font-size:18px}
  p{margin:0} a{color:var(--gold);font-weight:800}
  .muted{color:var(--muted)} .small{font-size:13px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center} .between{justify-content:space-between}
  button{font:inherit;font-weight:800;cursor:pointer;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 16px}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  button.link{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* the table */
  .table{position:relative;border-radius:26px;padding:14px 12px 16px;background:radial-gradient(120% 90% at 50% 40%,var(--felt) 0%,var(--felt-2) 70%);
    border:6px solid #5B3A1E;box-shadow:inset 0 0 0 2px #7A4E27,inset 0 12px 40px #0008,0 18px 40px #0007;display:flex;flex-direction:column;gap:14px}
  .seats{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap}
  .seat{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:90px;padding:6px 8px;border-radius:14px;position:relative}
  .seat.turn{background:#ffffff14;box-shadow:0 0 0 2px var(--gold)}
  .seat .who{display:flex;align-items:center;gap:4px;font-weight:900;font-size:14px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fan{display:flex;height:40px;align-items:flex-end}
  .fan i{display:block;width:22px;height:34px;border-radius:5px;margin-left:-13px;background:repeating-linear-gradient(45deg,#1a1a2e 0 4px,#2b2b4a 4px 8px);border:2px solid #fff;box-shadow:0 2px 4px #0006}
  .fan i:first-child{margin-left:0}
  .count{font-family:var(--display);font-size:13px;color:var(--gold)}
  .tag{font-size:11px;font-weight:900;border-radius:99px;padding:1px 8px;background:var(--gold);color:#2a1d00}
  .catch{font-size:13px;padding:5px 10px;border-radius:99px;background:#E5484D;border-color:#E5484D;color:#fff;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}

  .middle{display:flex;align-items:center;justify-content:center;gap:22px;min-height:150px;position:relative}
  .pile{position:relative}
  .pile .back{width:88px;height:128px;border-radius:12px;border:3px solid #fff;background:repeating-linear-gradient(45deg,#1a1a2e 0 6px,#2b2b4a 6px 12px);box-shadow:0 6px 0 #0005,0 12px 20px #0006;display:grid;place-items:center;font-family:var(--display);color:#fff;font-size:12px;letter-spacing:.06em;text-align:center}
  .pile button.back{padding:0;cursor:pointer}
  .pile button.back.go{box-shadow:0 0 0 4px var(--gold),0 12px 20px #0006;animation:pulse 1.2s ease-in-out infinite}
  .colorring{position:absolute;inset:-10px;border-radius:18px;pointer-events:none;box-shadow:0 0 0 5px var(--c),0 0 28px var(--c)}
  .dir{font-size:26px;opacity:.85}
  .chaosin{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#FFD6F4;white-space:nowrap}

  /* cards */
  .card{--c:#333;position:relative;width:74px;height:108px;flex:none;border-radius:11px;border:3px solid #fff;background:var(--c);color:#fff;
    display:grid;place-items:center;font-family:var(--display);box-shadow:0 4px 0 #0004,0 8px 14px #0005;user-select:none;-webkit-user-select:none;padding:0}
  .card::before{content:'';position:absolute;inset:9px 7px;border-radius:50% / 40%;background:#ffffffe6;transform:rotate(-24deg)}
  .card b{position:relative;font-size:30px;color:var(--c);-webkit-text-stroke:1px #0003;line-height:1}
  .card small{position:absolute;top:4px;left:6px;font-size:12px;color:#fff}
  .card.R{--c:var(--R)} .card.G{--c:var(--G)} .card.B{--c:var(--B)} .card.Y{--c:var(--Y)}
  .card.wild{--c:#16161f;background:conic-gradient(var(--R) 0 25%,var(--B) 0 50%,var(--Y) 0 75%,var(--G) 0) padding-box,#16161f}
  .card.wild::before{background:#16161f;inset:14px 10px}
  .card.wild b{color:#fff;font-size:24px}
  .card.chaos{--c:#1a1024;background:#1a1024;border-image:none;box-shadow:0 0 0 2px #ff5ad1,0 4px 0 #0004,0 8px 14px #0005}
  .card.chaos::before{background:linear-gradient(135deg,#ff5ad1,#7a5cff,#2fd5ff)}
  .card.chaos b{font-family:system-ui,sans-serif;font-size:32px;-webkit-text-stroke:0}
  .card.big{width:88px;height:128px}
  .card.big b{font-size:36px}

  /* your hand */
  .handbar{display:flex;flex-direction:column;gap:8px}
  .hand{display:flex;gap:6px;overflow-x:auto;padding:14px 4px 6px;scroll-snap-type:x proximity}
  .hand .card{cursor:pointer;scroll-snap-align:start;transition:transform .15s}
  .hand .card.can{transform:translateY(-10px);box-shadow:0 0 0 3px var(--gold),0 12px 18px #0006}
  .hand .card:not(.can){filter:saturate(.55) brightness(.8)}
  .hand.off .card{cursor:default;transform:none;filter:none;box-shadow:0 4px 0 #0004,0 8px 14px #0005}
  .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .lastbtn{background:var(--gold);border-color:var(--gold);color:#2a1d00;border-radius:99px}
  .lastbtn[aria-pressed=true]{background:#fff;border-color:#fff}
  .timer{height:8px;border-radius:99px;background:#ffffff22;overflow:hidden}
  .timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#E5484D,var(--gold));transition:width .2s linear}

  /* pickers */
  .gate{position:fixed;inset:0;z-index:80;background:#000a;display:grid;place-items:center;padding:16px}
  .gate .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;max-width:360px;width:100%;text-align:center}
  .swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .swatches button{height:70px;border:0;border-radius:14px;font-family:var(--display);font-size:16px;color:#fff;text-shadow:0 1px 2px #0008}
  .pick{display:flex;flex-direction:column;gap:8px}
  .pick button{display:flex;align-items:center;gap:8px;justify-content:center}

  .feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
  .feed li{border-left:3px solid var(--line);padding-left:10px}
  .botlive{display:flex}
  @media (max-width:560px){ .card{width:62px;height:92px} .card b{font-size:25px} .card.big,.pile .back{width:76px;height:112px} .middle{gap:16px;min-height:130px} .seat{min-width:76px} }
  /* Desktop: the table big, the log and extras in a column beside it. */
  @media (min-width:1000px) and (min-height:560px){
    .wrap{max-width:1320px}
    #play{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:repeat(3,auto) 1fr;column-gap:22px;row-gap:14px;align-items:start}
    #play > .table{grid-column:1;grid-row:1 / -1}
    #play > :not(.table){grid-column:2}
    .middle{min-height:220px}
    .card{width:84px;height:122px} .card.big,.pile .back{width:104px;height:150px}
    .hand{flex-wrap:wrap;overflow:visible}
  }
  </style>
</head>
<body>
<div class="wrap">
  <nav class="row between"><a href="./">← All games</a><span class="small muted" id="live"></span></nav>
  <div id="gtbar"></div>
  <header class="row between" style="align-items:flex-end">
    <div><span class="eyebrow">🃏 Chaos Cards</span><h1 id="title">Loading…</h1></div>
    <span class="small muted" id="status"></span>
  </header>
  <div id="play" style="display:flex;flex-direction:column;gap:14px">
    <section class="table" id="table">
      <div class="seats" id="seats"></div>
      <div class="middle">
        <div class="pile"><button type="button" class="back" id="drawBtn" aria-label="Draw a card">DRAW</button></div>
        <div class="pile"><span class="colorring" id="ring"></span><div id="top"></div></div>
        <span class="dir" id="dir" aria-hidden="true"></span>
        <span class="chaosin" id="chaosIn"></span>
      </div>
      <div class="handbar">
        <div class="row between"><span class="eyebrow" id="handLabel">Your hand</span><span class="acts" id="acts">
          <button type="button" class="lastbtn" id="lastBtn" aria-pressed="false" hidden>☝️ Last card!</button>
          <button type="button" id="passBtn" hidden>Pass</button>
        </span></div>
        <div class="timer" id="timer" hidden><i id="timerBar"></i></div>
        <div class="hand" id="hand"></div>
      </div>
    </section>
    <div class="botlive" id="botLiveRow" hidden><span class="small muted">🤖 The robot plays its turn a moment after yours.</span></div>
    <section class="panel" id="endPanel" hidden></section>
    <div id="nextSlot"></div>
    <details class="panel" id="logFold"><summary><h2>What happened</h2></summary><ul class="feed" id="feed"></ul>
      <p><button class="link" id="del" hidden>Delete this game</button></p></details>
  </div>
</div>
<div class="gate" id="gate" hidden><div class="box" id="gateBox"></div></div>
<script type="module" src="cards.js"></script>
</body>
</html>
