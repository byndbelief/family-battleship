<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Game Room">
  <title>Putt Post</title>
  <meta name="theme-color" content="#0F2A22">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;600;800&display=swap">
  <style>

/* One deliberate look: a mini-golf course at dusk. Single theme by choice. */
:root{
  color-scheme:dark;
  --bg:#0F2A22; --bg-2:#153A2F; --panel:#18433A; --line:#2C6353; --ink:#F4F1E4; --muted:#A8C6B8;
  --flag:#E4572E; --gold:#F2C14E; --sky:#7FD3F7; --felt:#46A75A;
  --display:"Lilita One","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:0 16px;padding-block:18px 60px;
  background:radial-gradient(900px 420px at 50% -8%,#23604E 0%,transparent 70%),var(--bg)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
h1{font-size:clamp(34px,8vw,56px)} h1 .f{color:var(--flag)}
h2{font-size:24px} h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
button{font:inherit;font-weight:800;cursor:pointer;border-radius:12px;border:1.5px solid var(--line);background:var(--bg-2);color:var(--ink);padding:10px 16px}
button.go{background:var(--flag);border-color:var(--flag);color:#fff;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.03em;padding:10px 22px}
button.gold{background:var(--gold);border-color:var(--gold);color:#2b1f00}
button.link{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=text],select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
select{width:auto}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.names{grid-template-columns:1fr}}
.names label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:13px;color:var(--muted)}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:800}
.choice input{accent-color:var(--gold)}
.choice label:has(input:checked){border-color:var(--gold);background:#F2C14E1f}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:18px;align-items:center}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero canvas{display:none}}
.hero canvas{width:150px;border-radius:14px;box-shadow:0 12px 30px #0007}

.course-wrap{position:relative;display:flex;justify-content:center}
#course{display:block;border-radius:18px;box-shadow:0 18px 40px #0008;touch-action:none;cursor:crosshair;max-width:100%}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay .card{background:#0F2A22ee;border:1px solid var(--line);border-radius:16px;padding:18px;max-width:320px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 12px 30px #0008}
.hudbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;background:var(--bg-2);border:1px solid var(--line)}
.pill b{color:var(--gold);font-variant-numeric:tabular-nums}
.tip{font-size:14px;color:var(--muted);text-align:center;min-height:1.5em}
/* Touch putting: a power meter the finger can't cover, and a bar to fine-tune and putt. */
.pmeter{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(70%,260px);height:26px;border-radius:99px;background:#0B211Acc;border:1.5px solid #ffffff44;overflow:hidden;z-index:2;pointer-events:none}
.pmeter i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#B6F09C,#F2C14E 60%,#E4572E)}
.pmeter span{position:relative;display:block;text-align:center;font-weight:800;font-size:14px;line-height:23px;color:#fff;text-shadow:0 1px 2px #000}
.putbar{display:grid;grid-template-columns:repeat(4,48px) 1fr 48px;gap:8px;align-items:center}
.putbar .nudge{width:48px;height:48px;padding:0;font-size:22px;line-height:1;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.putbar .go{min-height:52px;font-size:18px}
/* Not aimed yet (or not your putt): one wide waiting button; the nudges appear once you've aimed */
#play .putbar.waiting{grid-template-columns:1fr}
.putbar.waiting .nudge{display:none}
.putbar.waiting .go{opacity:.6;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:380px){.putbar{grid-template-columns:repeat(4,42px) 1fr 42px;gap:6px}.putbar .nudge{width:42px;height:42px}}

.send{border:1.5px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg-2)}
.send code{font-size:12px;word-break:break-all;color:var(--gold);background:#0B211A;border-radius:8px;padding:8px 10px;display:block;max-height:5.5em;overflow:auto}

.card-scroll{overflow-x:auto}
table.score{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
.score th,.score td{padding:6px 5px;text-align:center;border-bottom:1px solid var(--line);min-width:22px}
.score th:first-child,.score td:first-child{text-align:left;padding-left:0;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:var(--panel)}
.score thead th{color:var(--muted);font-weight:800;font-size:12px}
.score tr.par td{color:var(--muted);font-size:12px}
.score td.now{background:#F2C14E22;box-shadow:inset 0 0 0 2px var(--gold);border-radius:6px}
.score td.under{color:var(--gold);font-weight:800}
.score td.over{color:#F4A38C}
.score td.skip{color:#ffffff44}
.score td.tot{font-weight:800}
.score tr.lead td:first-child::after{content:" ★";color:var(--gold)}
/* celebrations */
.hio{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.hio span{font-family:var(--display);font-size:clamp(40px,12vw,76px);line-height:.95;color:#FFE08A;
  -webkit-text-stroke:3px #7A3A00;paint-order:stroke fill;text-shadow:0 6px 0 #7A3A00,0 0 40px #F2C14E;
  animation:hio 2.8s cubic-bezier(.2,1.6,.4,1) both}
.hio span.small-pop{font-size:clamp(28px,8vw,44px);color:#fff;-webkit-text-stroke:2px #1F5B3A;text-shadow:0 4px 0 #1F5B3A;animation:pop 1.6s ease-out both}
@keyframes hio{0%{transform:scale(.2) rotate(-12deg);opacity:0}18%{transform:scale(1.15) rotate(4deg);opacity:1}30%{transform:scale(.95) rotate(-2deg)}
  45%,80%{transform:scale(1) rotate(0)}100%{transform:scale(1.4);opacity:0}}
@keyframes pop{0%{transform:translateY(20px) scale(.6);opacity:0}20%{transform:translateY(0) scale(1.05);opacity:1}75%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
#course.shake{animation:shake .5s linear 2}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px) rotate(-1deg)}40%{transform:translate(5px,-4px) rotate(1deg)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,3px)}}
@media (prefers-reduced-motion:reduce){.hio span,.hio span.small-pop{animation:pop 2.4s linear both}#course.shake{animation:none}}
/* sneak attacks */
.attack{border:1.5px solid #E4572E88;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#2A1712}
.attack h3{color:#FF9A7A}
.atk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.atk-list button{text-align:left;font-weight:600;display:flex;flex-direction:column;gap:2px;padding:10px 12px}
.atk-list button b{font-weight:800}
.atk-list button[aria-pressed=true]{border-color:var(--gold);background:#F2C14E22}
.tokens{color:var(--gold);font-weight:800}
/* cheating */
.cheats{border:1.5px dashed #E4572E99;border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:#2A1712}
.cheats .lbl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#FF9A7A;width:100%;text-align:center}
.cheats button{padding:6px 12px;font-size:14px}
.cheats button[aria-pressed=true]{border-color:var(--gold);background:#F2C14E22}
.hio span.busted{color:#FF5A4E;-webkit-text-stroke:3px #3a0000;text-shadow:0 6px 0 #3a0000,0 0 40px #FF5A4E}
.badge{font-size:12px}
[hidden]{display:none!important}
#holeName,.hudbar .pill{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* Top-left: the ⚙️ Settings button owns the bottom-right corner (and the top-right in full screen). */
.course-wrap .fsslot{position:absolute;left:8px;top:8px;z-index:3}
/* 🗺️ the whole hole (055): a big course is followed up close; this steps back to see all of it */
/* The slingshot (like Hilltop's): let go of a pull and a see-through Putt pops up where your finger
   lifted, ↺ ↻ to turn the aim, − + for power, ✕ to drop it */
.puttHere{position:absolute;z-index:6;width:160px;height:140px;transform:translate(-50%,-50%);pointer-events:none}
.puttHere[hidden]{display:none}
.puttHere > *{pointer-events:auto;touch-action:manipulation}
.phgo{position:absolute;left:42px;top:24px;width:76px;height:76px;padding:0;border-radius:50%;border:2.5px solid #FFF4D6cc;background:radial-gradient(circle at 50% 38%,#8CE06Aa6,#46A75A99 60%,#2E7D4699);color:#fff;font:900 24px/1 system-ui,sans-serif;display:grid;place-items:center;align-content:center;gap:2px;box-shadow:0 6px 18px #0006;text-shadow:0 1px 3px #0009;cursor:pointer;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.phgo b{font-size:12px;letter-spacing:.06em}
.phgo:active{transform:scale(.92)}
.phn{position:absolute;width:36px;height:36px;min-height:0;padding:0;border-radius:50%;border:1.5px solid #ffffff55;background:#0E0C2266;color:#fff;font:800 19px/1 system-ui,sans-serif;display:grid;place-items:center;user-select:none;-webkit-user-select:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.phn:active{background:#F2C14E66}
.ph-l{left:0;top:12px}.ph-r{right:0;top:12px}.ph-m{left:0;top:76px}.ph-p{right:0;top:76px}.ph-x{left:62px;top:-22px;width:32px;height:32px;font-size:15px}
.phread{position:absolute;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap;padding:2px 8px;border-radius:99px;background:#0E0C2288;color:#FFE08A;font:800 12px/1.3 system-ui,sans-serif;font-variant-numeric:tabular-nums;pointer-events:none}
.puttHere.pop .phgo{animation:phpop .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes phpop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.puttHere.pop .phgo{animation:none}}
/* Phones: the course runs edge to edge */
@media (max-width:760px){ #play:not(.fs-on) #course{border-radius:0} }
#play.fs-on #course{border-radius:0}
.mapbtn{position:absolute;right:10px;bottom:10px;z-index:3;width:42px;height:42px;padding:0;border-radius:50%;font-size:20px;line-height:1;background:#0B1A12b3;border:1px solid #ffffff33;box-shadow:0 4px 12px #0006}
.mapbtn.on{background:#F2C14E;border-color:#F2C14E}
.score td small.pen{display:block;font-size:9px;line-height:1;font-weight:700;color:#FF9A7A;opacity:.9}
.score td.going{font-style:italic;opacity:.75}
#play.fs-on{gap:8px!important}
#play.fs-on > .panel{display:none}
/* Full screen on a landscape phone (047): the sideways course down the left at full height; the hole,
   putt buttons and backpack in a column beside it (clear of the toolbar in the top-right). */
@media (orientation:landscape) and (max-height:559px){
  #play.fs-on{display:grid!important;grid-template-columns:auto minmax(0,1fr);grid-auto-rows:min-content;column-gap:10px;align-content:start;padding:6px!important}
  #play.fs-on > .course-wrap{grid-column:1;grid-row:1 / span 20;align-self:center}
  #play.fs-on > :not(.course-wrap){grid-column:2;min-width:0}
  #play.fs-on > .hudbar{padding-top:50px;flex-direction:column;align-items:flex-start;gap:4px}
  #play.fs-on .hudbar h2{font-size:17px}
  #play.fs-on .hudbar .row{flex-wrap:wrap;gap:4px}
  #play.fs-on .hudbar .pill{font-size:12px;padding:2px 8px}
  #play.fs-on .putbar{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
  #play.fs-on .putbar .nudge{width:100%;height:40px}
  #play.fs-on .putbar #puttGo{grid-column:1 / -1;grid-row:2;min-height:48px}
  #play.fs-on #packMini{overflow-x:auto}
}
/* Phones: the course first; cheats and backpack shrink to one scrollable row each. */
@media (max-width:640px){
  .wrap{gap:10px}
  #play{gap:10px!important}
  .hudbar h2{font-size:18px}
  .cheats{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:6px 8px}
  .cheats .lbl{display:none}
  .cheats::before{content:'🤫';font-size:18px;flex:none}
  .cheats button{flex:none;white-space:nowrap}
}
@media (max-width:640px){#pack .backpack{flex-wrap:nowrap!important;overflow-x:auto;padding:6px 8px!important}#pack .backpack>span:first-child{font-size:0!important}#pack .backpack>span:first-child::before{content:'🎒';font-size:18px}#pack .backpack button{flex:none;white-space:nowrap}}
.fs-on .cheats{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}
/* Desktop: the course as tall as the window allows, with the hole, the putt controls, backpack
   and scorecard in a column beside it. Rows are content-sized; the last takes up the slack so the
   course spanning them all doesn't spread the side column apart. */
@media (min-width:1000px) and (min-height:560px){
  body{padding-block:14px 24px}
  .wrap{max-width:1180px;gap:12px}
  #play:not(.fs-on){display:grid!important;grid-template-columns:auto minmax(340px,420px);grid-template-rows:repeat(9,auto) 1fr;column-gap:28px;row-gap:12px!important;align-items:start;justify-content:center}
  #play:not(.fs-on) > .course-wrap{grid-column:1;grid-row:1 / -1}
  #play:not(.fs-on) > :not(.course-wrap){grid-column:2}
  #play:not(.fs-on) .hudbar{flex-direction:column;align-items:flex-start;gap:10px}
  #play:not(.fs-on) .hudbar h2{font-size:30px}
  #play:not(.fs-on) .tip{text-align:left}
  #play:not(.fs-on) .putbar{grid-template-columns:repeat(4,44px) 1fr 44px}
  #play:not(.fs-on) .putbar .nudge{width:44px;height:44px}
  #play:not(.fs-on) .card-scroll{max-height:40vh;overflow:auto}
}
  .themebtn{cursor:pointer;font:inherit;color:inherit}
  .themebtn[aria-pressed=true]{background:#4B7A33;border-color:#6FBE4F}
  @media (max-width:520px){.themebtn .tlabel{display:none}}   /* phones: just the icon, so the pills stay on one row */
  .topnav{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .botlive{display:flex}
  .botlive button{border-radius:99px;padding:7px 14px;font-size:14px}
  .botlive button[aria-pressed=true]{background:var(--flag);border-color:var(--flag);color:#fff}
  .topnav a{color:var(--gold);font-weight:800}
    /* Full screen, upright: the chips row sits up top beside the toolbar */
  @media (orientation:portrait){
    body.fs-lock #play.fs-on .hudbar{padding-right:var(--gtw,56px);flex-wrap:nowrap;min-height:40px}
    body.fs-lock #play.fs-on .hudbar > .stack{display:none}
    body.fs-lock #play.fs-on .hudbar .row{flex:1;flex-wrap:nowrap;gap:5px;min-width:0;overflow:hidden}
    body.fs-lock #play.fs-on .hudbar .pill{font-size:13px;padding:4px 9px;white-space:nowrap}
    body.fs-lock #play.fs-on #whoPill{min-width:0;overflow:hidden;text-overflow:ellipsis}
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="topnav gtop"><a href="./">← All games</a><span class="small muted" id="live">Live</span></nav>
  <div id="gtbar"></div>
  <section id="play" class="stack" style="gap:14px">
    <div class="hudbar">
      <div class="stack" style="gap:2px"><span class="small muted" id="holeNo">Loading…</span><h2 id="holeName">Putt Post</h2></div>
      <div class="row"><span data-clockslot></span><button type="button" class="pill themebtn" id="themeBtn">⛳ Mini golf</button><span class="pill" id="whoPill"></span><span class="pill">Strokes <b id="strokes">0</b></span></div>
    </div>
    <div class="course-wrap">
      <canvas id="course" aria-label="Mini golf hole. Drag backward from anywhere on the course to aim, release to putt."></canvas>
      <div class="pmeter" id="pmeter" hidden><i id="pfill"></i><span id="ptext"></span></div>
      <div class="puttHere" id="puttHere" hidden role="group" aria-label="Putt and fine-tune">
        <button type="button" class="phgo" id="phGo" aria-label="Putt">⛳<b>PUTT</b></button>
        <button type="button" class="phn ph-l" data-turn="-1" aria-label="Aim left">↺</button>
        <button type="button" class="phn ph-r" data-turn="1" aria-label="Aim right">↻</button>
        <button type="button" class="phn ph-m" data-pow="-1" aria-label="Less power">−</button>
        <button type="button" class="phn ph-p" data-pow="1" aria-label="More power">+</button>
        <button type="button" class="phn ph-x" id="phX" aria-label="Cancel this putt">✕</button>
        <span class="phread" id="phRead" aria-live="off"></span>
      </div>
      <button type="button" class="mapbtn" id="mapBtn" hidden aria-pressed="false" title="The whole hole" aria-label="Show the whole hole">🗺️</button>
      <div class="hio" id="hio" hidden></div>
      <div class="overlay" id="gate" hidden><div class="card" id="gateCard"></div></div>
    </div>
    <div id="packMini"></div>
    <div class="putbar" id="putbar" hidden>
      <button type="button" class="nudge" data-turn="-1" aria-label="Aim left">↺</button>
      <button type="button" class="nudge" data-turn="1" aria-label="Aim right">↻</button>
      <button type="button" class="nudge" data-pow="-1" aria-label="Less power">−</button>
      <button type="button" class="nudge" data-pow="1" aria-label="More power">+</button>
      <button type="button" class="go" id="puttGo">Putt!</button>
      <button type="button" class="nudge" id="puttX" aria-label="Cancel this putt">✕</button>
    </div>
    <p class="tip" id="tip"></p>
    <div id="pack"></div>
    <div class="cheats" id="cheats" hidden></div>
    <div class="row" style="justify-content:center"><button id="skip" hidden>Skip replay</button></div>
    <div class="send" id="send" hidden></div>
    <details class="panel mfold" id="cardFold">
      <summary><h3>Scorecard</h3></summary>
            <div class="card-scroll" id="scorecard"></div>
      <div class="row" id="jumpRow" hidden>
        <label for="jumpTo" class="small muted" style="font-weight:800">Skip ahead to</label>
        <select id="jumpTo"></select>
        <button id="jumpGo">Skip</button>
        <span class="small muted" id="jumpNote"></span>
      </div>
    </details>
  </section>
</div>
<script type="module" src="golf.js"></script>
</body>
</html>
