<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Game Room">
  <title>Squirrel Chaos</title>
  <meta name="theme-color" content="#1B2B12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap">
  <style>
  /* One look: an autumn forest at dusk. The HUD comes from shell.js. */
  :root{color-scheme:dark;--bg:#14200E;--panel:#1E2E15;--line:#3C5A26;--ink:#F6F2E4;--muted:#BFCBA8;--gold:#F5C542;--rust:#E07A3A;--bannerc:#FFE08A;
    --display:"Bungee","Arial Black",Impact,sans-serif;--body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  html,body{background:var(--bg);margin:0;height:100%}
  body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;overscroll-behavior:none}
  [hidden]{display:none!important}
  .wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .topnav{display:flex;align-items:center;gap:10px;min-height:40px}
  .topnav a{color:var(--gold);font-weight:800;text-decoration:none}
  h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.05}
  h1{font-size:clamp(20px,5.5vw,30px)}
  button{font:inherit;font-weight:800;cursor:pointer;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 16px}
  button.go{background:var(--gold);border-color:var(--gold);color:#2A2100;font-size:18px;padding:12px 22px}
  #play{position:relative}
  .stage{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 14px 34px #0009;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--bg)}
  #cv{display:block;width:100%;cursor:crosshair}
  #play.fs-on{position:fixed;inset:0;z-index:60;background:var(--bg);padding:0}
  #play.fs-on .stage{border-radius:0;height:100%}
  </style>
</head>
<body>
<div class="wrap">
  <nav class="topnav gtop"><a href="./">← All games</a><h1 class="intop">🐿️ Squirrel Chaos</h1></nav>
  <section id="play"><div class="stage" id="stage"><canvas id="cv" aria-label="A forest full of squirrels: tap one to staple it"></canvas></div></section>
</div>
<script type="module">
  import { runShell } from './shell.js';
  import squirrel from './organs/squirrel.js';
  runShell({
    organs: [squirrel], key: 'squirrel', title: 'Squirrel Chaos', icon: '🐿️', again: 'Play again',
    intro: `<p>Tap to fire the stapler. Staple a big squirrel and it <b>splits in two</b>; only the littlest ones get pinned, and score (more for a quick combo).</p>
      <p class="muted small">They come to the beat of the chaos curve, x → r·x·(1−x): calm, then a rhythm, then chaos, with twists at its peaks and a ✨ golden squirrel when x nearly touches 1. Four days, each deeper inside the last tree's knothole. Tap the stapler (or R) to reload.</p>
      <p class="muted small">📦 Shoot the crates for a 🔩 nail gun, 💥 shotgun, 🧨 tack bombs, ⚡ a chain stapler or the 🌀 chaos cannon. And watch out: angry squirrels throw acorns. Shoot them down, or three bonks and you're out.</p>
      <p class="muted small">Four days. It gets darker the deeper you go: the pinned ones stay, the trees watch, and something in the knothole is waking. 13+: creepy, not gory.</p>`,
  });
</script>
</body>
</html>
